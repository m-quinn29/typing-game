<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Versus</title>
    <style>

        button {
            background-color: #c5bb8d;
            color: #f2efe6;
        }

        .navigation-bar {
            position: absolute;
            top: 20%;
            background: #dbd4bf;
            padding: 10px;
            border-radius: 5px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 1000px;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ece6d3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .game-container {
            position: relative;
            background: #fbf4e1;
            padding: 40px 80px;
            border-radius: 5px;
            max-width: 800px;
            width: 100%;
            height: 500px;
            box-sizing: border-box;
        }

        .game-state {
            display: none;
        }

        .game-state.active {
            display: block;
        }

        .prompt-text {
            font-size: 30px;
            line-height: 40px;
            height: 120px;
            font-weight: bold;
            color: #576d74;
            margin-bottom: 20px;

            scroll-behavior: smooth;
            overflow: hidden;
        }

        .type-input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #574b27;
            border-radius: 5px;
            color: #647a82;
        }

        .join-buttons {
            width: 300px;
            /*height: 60px;*/
            /*margin-top: 10px;*/
        }

        .join-race {
            width: 150px;
            height: 60px;
            margin-top: 10px;
        }

        .join-race button {
            background-color: #268ad0;
            color: #ece6d3;
            width: 100%;
            height: 100%;
        }




    </style>
</head>
<body>
<div class="main">
    <div th:replace="fragments/navigationBar :: navigationBar"></div>

    <div class="game-container">

        <div class="game-state join-buttons active">
            <div class="join-race"> <button data-type="quote" type="button" >Join Quote Race</button> </div>
            <div class="join-race"> <button data-type="word" type="button" >Join Words Race</button> </div>
        </div>

        <div class="game-state waiting-for-race">
            <div class="searching-for-race-text">
                Searching for race
            </div>
        </div>

        <div class="game-state race" >

            <div
                class="timer-display" id="timer">
            </div>

            <div class="prompt-text" id="prompt-text" th:text="${promptVariable}">
                placeholder text
            </div>

            <label>
                <input type="text" class="type-input" id="input-field" placeholder="Start typing here..." autocomplete="off">
            </label>


        </div>

    </div>




</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.2.1/bundles/stomp.umd.min.js"></script>
<script type="module" th:src="@{/js/modules/navigation.js}"></script>
<script type="module" th:src="@{/js/modules/versus-mode.js}"></script>


</body>
</html>
