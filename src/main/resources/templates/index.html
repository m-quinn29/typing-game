<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Typing Game</title>
    <style>

        button {
            background-color: #c5bb8d;
            color: #f2efe6;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #ece6d3;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .navigation-bar {
            position: absolute;
            top: 20%;
            background: #dbd4bf;
            padding: 10px;
            border-radius: 5px;
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }

        .main {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 1000px;
        }

        .game-container {
            background: #fbf4e1;
            padding: 100px 40px;
            border-radius: 5px;
            max-width: 800px;
            width: 100%;
            height: 500px;
            box-sizing: border-box;
        }

        .prompt-text {
            font-size: 30px;
            line-height: 40px;
            height: 120px;
            font-weight: bold;
            color: #576d74;
            margin-bottom: 20px;

            scroll-behavior: smooth;
            overflow: hidden;
        }

        .incorrect-space {
            /*background-color: #c94a16;*/
            text-decoration: underline;
        }

        .prompt-text span {
            /*display: inline-block;*/
        }

        .type-input {
            width: 80%;
            padding: 10px;
            font-size: 16px;
            border: 2px solid #574b27;
            border-radius: 5px;
            color: #647a82;
        }

        .mode-selector-container {
            margin-right: 10px;
        }

        .time-selector-container {
            margin-top: 10px;
        }

        .next-button {
            margin-top: 10px;
        }

    </style>
</head>
<body>
<div class="main">

    <div th:replace="fragments/navigationBar :: navigationBar"></div>

    <div class="game-container">
        <div class="mode-selector-container">
            <button data-mode="quote" type="button" >Quote</button>
            <button data-mode="word" type="button" >Words</button>
        </div>

        <div class="time-selector-container" id="time-selectors" style="display: none;">
            <button data-time="15" type="button" >15s</button>
            <button data-time="30" type="button" >30s</button>
            <button data-time="60" type="button" >60s</button>
        </div>

        <div
            class="timer-display" id="timer" style="display: none">
        </div>

        <div class="prompt-text" id="prompt-text" th:text="${promptVariable}">
            placeholder text
        </div>

        <label>
            <input type="text" class="type-input" id="input-field" placeholder="Start typing here..." autocomplete="off">
        </label>

        <div>
            <button class="next-button" id="next-button" type="button">New Text</button>
        </div>
    </div>
</div>
<script type="module" th:src="@{/js/modules/practice-mode.js}"></script>
<script type="module" th:src="@{/js/modules/navigation.js}"></script>

</body>
</html>
